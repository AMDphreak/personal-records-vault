appId: com.amdphreak.personalRecordsVault
productName: Personal Records Vault
copyright: Copyright © 2026 Ryan Johnson
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
  executableName: PersonalRecordsVault
nsis:
  artifactName: ${name}-${version}-windows-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.productivity
dmg:
  artifactName: ${name}-${version}-mac.${ext}
linux:
  target:
    - AppImage
  maintainer: Ryan Johnson
  category: Office
appImage:
  artifactName: ${name}-${version}-linux.${ext}
npmRebuild: false
publish: null
