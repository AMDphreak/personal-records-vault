name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build desktop (electron-vite)
        run: pnpm --filter @prv/desktop build

      - name: Build extension (Vite)
        run: pnpm --filter @prv/extension build

      - name: Build optional D CLI
        run: |
          if command -v dub >/dev/null 2>&1; then
            cd native/cli && dub build
          else
            echo "dub not installed; skipping D CLI"
          fi
